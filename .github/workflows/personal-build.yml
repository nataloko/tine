# Personal-fork build: produce just the two artifacts I use — a portable Linux
# AppImage and a Windows x64 installer — for this fork's bullet-threading build.
#
# It is DELIBERATELY a separate file from the upstream release.yml (not an edit to
# it), so rebasing this branch onto upstream master stays conflict-free. The
# auto-updater is off in tauri.conf.json (createUpdaterArtifacts:false), so no
# signing secrets are required and the app never updates itself to the upstream
# (threadless) release.
#
# Two ways to run it:
#   • Push a tag `mine-v*` (e.g. `git tag mine-v0.4.7 && git push fork mine-v0.4.7`)
#     → builds BOTH platforms and publishes a GitHub Release with permanent
#       download links for the AppImage + Windows installer.
#   • Actions tab → "personal-build" → Run workflow → builds and uploads the two
#     files as (90-day) run Artifacts, no Release. Handy for a quick smoke test.
name: personal-build

on:
  workflow_dispatch:
  push:
    tags: ["mine-v*"]

permissions:
  contents: write # the release job creates a GitHub Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage
            artifact: "target/release/bundle/appimage/*.AppImage*" # .AppImage + .AppImage.zsync
          - platform: windows-latest
            bundles: nsis
            artifact: "target/release/bundle/nsis/*-setup.exe"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace is the repo ROOT (target/ lives there, not src-tauri/).
          workspaces: ". -> target"

      - run: npm ci

      # beforeBuildCommand (tauri.conf.json) runs `npm run build`. Build only the
      # bundle I ship on this platform; no signing key needed (updater artifacts off).
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }}

      # Embed AppImage update-information + generate the .zsync control file, so
      # GearLever / AppImageUpdate auto-detect updates from this fork's releases.
      # Tauri's bundler doesn't set this (its own updater is disabled), so we
      # re-pack the AppDir with appimagetool -u. The glob in the update string must
      # match the .zsync asset name in the release (Tine_<ver>_amd64.AppImage.zsync).
      - name: Add AppImage update info (GearLever)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          set -euo pipefail
          sudo apt-get install -y libfuse2 zsync
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd target/release/bundle/appimage
          img=$(ls *.AppImage | head -1)                 # e.g. Tine_0.4.7_amd64.AppImage
          echo "Embedding update info into $img"
          # Prefer the AppDir Tauri leaves behind; otherwise reconstruct it.
          appdir=$(ls -d *.AppDir 2>/dev/null | head -1 || true)
          if [ -z "$appdir" ]; then
            "./$img" --appimage-extract >/dev/null
            appdir=squashfs-root
          fi
          rm -f "$img"                                    # repack over the original
          export ARCH=x86_64
          /tmp/appimagetool --appimage-extract-and-run \
            -u "gh-releases-zsync|nataloko|tine|latest|Tine_*_amd64.AppImage.zsync" \
            "$appdir" "$img"
          rm -rf squashfs-root
          echo "--- result ---"; ls -la *.AppImage*

      - uses: actions/upload-artifact@v4
        with:
          name: tine-threading-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # On a `mine-v*` tag, gather both platforms' artifacts and publish one Release
  # with permanent download URLs. Skipped on manual dispatch (no tag to release).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mine-v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=$(find dist -type f)
          echo "Release assets:"; echo "$files"
          title="Tine — nataloko extras ($TAG)"
          notes="Personal build of Tine with nataloko's extra features (see Settings → Extras), rebased on upstream master. Auto-updater is disabled. Assets: portable Linux AppImage (x64) + Windows x64 installer."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$REPO"
          else
            gh release create "$TAG" $files --repo "$REPO" --title "$title" --notes "$notes"
          fi
